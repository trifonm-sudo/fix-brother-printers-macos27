name: Build DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x "Fix Brother Printers for macOS27.app/Contents/MacOS/run"
        
      - name: Ad-hoc sign the app
        run: codesign --force --deep --sign - "Fix Brother Printers for macOS27.app"

      - name: Build DMG
        run: hdiutil create -volname "Fix Brother Printers for macOS27" -srcfolder "Fix Brother Printers for macOS27.app" -ov -format UDZO "Fix Brother Printers for macOS27.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: FixBrotherPrinters-dmg
          path: "Fix Brother Printers for macOS27.dmg"
