name: Build Self-Running Script

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Self-Running Command File
        run: |
          cat << 'EOF' > FixBrotherPrinters.command
          #!/bin/bash
          echo "========================================="
          echo "Starting Brother Printer Fix for macOS 27"
          echo "========================================="
          
          # Тук GitHub автоматично вгражда вашия софтуерен фикс
          # Можете да поставите реалните команди под този ред:
          sudo chmod -R 755 /usr/libexec/cups
          
          echo "Fix applied successfully! Please restart your Mac."
          read -p "Press [Enter] to close this window..."
          EOF
          
          chmod +x FixBrotherPrinters.command

      - name: Upload Running Script
        uses: actions/upload-artifact@v4
        with:
          name: FixBrotherPrinters-script
          path: FixBrotherPrinters.command
